  DELETE FROM core_activation_eda_credentials WHERE activation_id IN (SELECT id FROM core_activation WHERE status IN ('pending', 'pending_delete'));

  DELETE FROM core_rulebookprocess WHERE activation_id IN (SELECT id FROM core_activation WHERE status IN ('pending', 'pending_delete'));

  DELETE FROM core_auditaction WHERE activation_id IN (SELECT id FROM core_activation WHERE status IN ('pending', 'pending_delete'));

  DELETE FROM core_auditrule WHERE activation_id IN (SELECT id FROM core_activation WHERE status IN ('pending', 'pending_delete'));

  -- Now delete the activations
