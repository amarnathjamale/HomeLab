---
# AWX Provisioning Job
# Run after AWX is ready to create all resources
apiVersion: v1
kind: ConfigMap
metadata:
  name: awx-provision-script
  namespace: awx
data:
  provision.sh: |
    #!/bin/bash
    set -e

    AWX_URL="http://awx-demo-service.awx.svc.cluster.local:80"
    AWX_USER="admin"

    # Get AWX password from secret
    AWX_PASS=$(cat /secrets/password)

    echo "=== AWX Resource Provisioning ==="
    echo "Waiting for AWX API..."
    until curl -s -u "$AWX_USER:$AWX_PASS" "$AWX_URL/api/v2/ping/" 2>/dev/null | grep -q "version"; do
      echo "  AWX not ready, waiting..."
      sleep 10
    done
    echo "AWX API is ready!"

    # Change admin password to 'admin'
    echo "Setting admin password to 'admin'..."
    curl -s -X PUT "$AWX_URL/api/v2/users/1/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"password": "admin"}' > /dev/null || true
    AWX_PASS="admin"

    # Create Organization
    echo "Creating Demo Organization..."
    curl -s -X POST "$AWX_URL/api/v2/organizations/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Demo Organization", "description": "Example organization for demos"}' || true

    # Create Team
    echo "Creating DevOps Team..."
    curl -s -X POST "$AWX_URL/api/v2/teams/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "DevOps Team", "description": "DevOps engineers team", "organization": 1}' || true

    # Create User
    echo "Creating Demo User..."
    curl -s -X POST "$AWX_URL/api/v2/users/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"username": "demouser", "password": "demopass123", "email": "demo@example.com", "first_name": "Demo", "last_name": "User"}' || true

    # Create Credentials
    echo "Creating Credentials..."
    curl -s -X POST "$AWX_URL/api/v2/credentials/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Demo Machine Credential", "description": "SSH credential", "organization": 1, "credential_type": 1, "inputs": {"username": "ansible", "password": "ansible123"}}' || true

    curl -s -X POST "$AWX_URL/api/v2/credentials/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Demo SCM Credential", "description": "Git credential", "organization": 1, "credential_type": 2, "inputs": {"username": "git", "password": "gitpassword"}}' || true

    curl -s -X POST "$AWX_URL/api/v2/credentials/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Demo Vault Credential", "description": "Vault password", "organization": 1, "credential_type": 3, "inputs": {"vault_password": "vaultpass123"}}' || true

    # Create Project
    echo "Creating Demo Project..."
    curl -s -X POST "$AWX_URL/api/v2/projects/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Demo Ansible Project", "description": "Sample playbooks", "organization": 1, "scm_type": "git", "scm_url": "https://github.com/ansible/ansible-tower-samples", "scm_branch": "master"}' || true

    echo "Waiting for project sync..."
    sleep 30

    # Create Inventory
    echo "Creating Demo Inventory..."
    curl -s -X POST "$AWX_URL/api/v2/inventories/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Demo Inventory", "description": "Demo hosts inventory", "organization": 1}' || true

    # Create Group
    echo "Creating Inventory Group..."
    curl -s -X POST "$AWX_URL/api/v2/groups/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "webservers", "description": "Web server hosts", "inventory": 1}' || true

    # Create Hosts
    echo "Creating Hosts..."
    curl -s -X POST "$AWX_URL/api/v2/hosts/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "localhost", "description": "Local execution", "inventory": 1, "variables": "ansible_connection: local"}' || true

    curl -s -X POST "$AWX_URL/api/v2/hosts/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "webserver1.example.com", "description": "Web server", "inventory": 1, "variables": "ansible_host: 192.168.1.10\nansible_user: ansible"}' || true

    # Get project ID (should be 6 after successful sync)
    echo "Getting project ID..."
    PROJECT_ID=$(curl -s -u "$AWX_USER:$AWX_PASS" "$AWX_URL/api/v2/projects/?name=Demo+Ansible+Project" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
    echo "Project ID: $PROJECT_ID"

    # Create Job Template
    echo "Creating Job Templates..."
    curl -s -X POST "$AWX_URL/api/v2/job_templates/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d "{\"name\": \"Demo Job Template\", \"description\": \"Hello world playbook\", \"organization\": 1, \"project\": $PROJECT_ID, \"playbook\": \"hello_world.yml\", \"inventory\": 1, \"job_type\": \"run\"}" || true

    # Create Workflow
    echo "Creating Workflow..."
    curl -s -X POST "$AWX_URL/api/v2/workflow_job_templates/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Demo Workflow", "description": "Example workflow", "organization": 1}' || true

    # Create Notification Template
    echo "Creating Notification Template..."
    curl -s -X POST "$AWX_URL/api/v2/notification_templates/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Email Notification", "description": "Email on completion", "organization": 1, "notification_type": "email", "notification_configuration": {"host": "smtp.example.com", "port": 587, "username": "awx@example.com", "password": "emailpass", "sender": "awx@example.com", "recipients": ["admin@example.com"], "use_tls": true, "use_ssl": false}}' || true

    # Create Execution Environment
    echo "Creating Execution Environment..."
    curl -s -X POST "$AWX_URL/api/v2/execution_environments/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "Demo Execution Environment", "description": "Custom EE", "organization": 1, "image": "quay.io/ansible/awx-ee:latest"}' || true

    # Create OAuth Application
    echo "Creating OAuth Application..."
    curl -s -X POST "$AWX_URL/api/v2/applications/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"name": "EDA Application", "description": "OAuth for EDA", "organization": 1, "authorization_grant_type": "password", "client_type": "confidential"}' || true

    # Create Token for EDA
    echo "Creating EDA Token..."
    TOKEN_RESPONSE=$(curl -s -X POST "$AWX_URL/api/v2/tokens/" \
      -H "Content-Type: application/json" \
      -u "$AWX_USER:$AWX_PASS" \
      -d '{"description": "EDA Integration Token", "scope": "write"}')

    TOKEN=$(echo "$TOKEN_RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
    echo "EDA Token: $TOKEN"

    # Save token for EDA provisioning
    echo "$TOKEN" > /tmp/awx-token.txt

    echo ""
    echo "=== AWX Provisioning Complete ==="
    echo "Login: admin / admin"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: awx-provision
  namespace: awx
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provision
        image: curlimages/curl:latest
        command: ["/bin/sh", "/scripts/provision.sh"]
        volumeMounts:
        - name: script
          mountPath: /scripts
        - name: awx-secret
          mountPath: /secrets
      volumes:
      - name: script
        configMap:
          name: awx-provision-script
          defaultMode: 0755
      - name: awx-secret
        secret:
          secretName: awx-demo-admin-password
