---
# EDA Provisioning Job
# Run after EDA is ready to create all resources
apiVersion: v1
kind: ConfigMap
metadata:
  name: eda-provision-script
  namespace: eda
data:
  provision.sh: |
    #!/bin/bash
    set -e

    EDA_URL="http://eda-api.eda.svc.cluster.local:8000"
    EDA_USER="admin"

    # Get EDA password from secret
    EDA_PASS=$(cat /secrets/password)

    echo "=== EDA Resource Provisioning ==="
    echo "Waiting for EDA API..."
    until curl -s -u "$EDA_USER:$EDA_PASS" "$EDA_URL/api/eda/v1/users/me/" 2>/dev/null | grep -q '"username"'; do
      echo "  EDA not ready, waiting..."
      sleep 10
    done
    echo "EDA API is ready!"

    # Create Decision Environment
    echo "Creating Decision Environment..."
    curl -s -X POST "$EDA_URL/api/eda/v1/decision-environments/" \
      -H "Content-Type: application/json" \
      -u "$EDA_USER:$EDA_PASS" \
      -d '{"name": "Demo Decision Environment", "description": "Default DE for rulebooks", "image_url": "quay.io/ansible/ansible-rulebook:v1.1.1", "organization_id": 1, "pull_policy": "always"}' || true

    # Create Project
    echo "Creating EDA Project..."
    curl -s -X POST "$EDA_URL/api/eda/v1/projects/" \
      -H "Content-Type: application/json" \
      -u "$EDA_USER:$EDA_PASS" \
      -d '{"name": "Demo EDA Project", "description": "Sample rulebooks", "url": "https://github.com/ansible/event-driven-ansible", "organization_id": 1}' || true

    echo "Waiting for project sync..."
    sleep 30

    # Create Event Stream Credential
    echo "Creating Event Stream Credential..."
    curl -s -X POST "$EDA_URL/api/eda/v1/eda-credentials/" \
      -H "Content-Type: application/json" \
      -u "$EDA_USER:$EDA_PASS" \
      -d '{"name": "github-webhook-cred", "credential_type_id": 7, "organization_id": 1, "inputs": {"username": "github", "password": "webhook123", "auth_type": "basic", "http_header_key": "Authorization"}}' || true

    # Create Container Registry Credential
    echo "Creating Registry Credential..."
    curl -s -X POST "$EDA_URL/api/eda/v1/eda-credentials/" \
      -H "Content-Type: application/json" \
      -u "$EDA_USER:$EDA_PASS" \
      -d '{"name": "Container Registry Cred", "credential_type_id": 2, "organization_id": 1, "inputs": {"host": "quay.io", "username": "myuser", "password": "mypassword"}}' || true

    # Get AWX token if available
    if [ -f /awx-token/token ]; then
      AWX_TOKEN=$(cat /awx-token/token)
      echo "Creating AWX Controller Token..."
      curl -s -X POST "$EDA_URL/api/eda/v1/users/me/awx-tokens/" \
        -H "Content-Type: application/json" \
        -u "$EDA_USER:$EDA_PASS" \
        -d "{\"name\": \"AWX Controller Token\", \"description\": \"Token for AWX integration\", \"token\": \"$AWX_TOKEN\"}" || true
    fi

    # Get rulebook ID
    echo "Getting rulebook ID..."
    sleep 10
    RULEBOOK_ID=$(curl -s -u "$EDA_USER:$EDA_PASS" "$EDA_URL/api/eda/v1/rulebooks/" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

    if [ -n "$RULEBOOK_ID" ]; then
      # Create Rulebook Activation (disabled)
      echo "Creating Rulebook Activation..."
      curl -s -X POST "$EDA_URL/api/eda/v1/activations/" \
        -H "Content-Type: application/json" \
        -u "$EDA_USER:$EDA_PASS" \
        -d "{\"name\": \"Demo Webhook Activation\", \"description\": \"Webhook event handler\", \"rulebook_id\": $RULEBOOK_ID, \"decision_environment_id\": 1, \"organization_id\": 1, \"is_enabled\": false}" || true
    fi

    echo ""
    echo "=== EDA Provisioning Complete ==="
    echo "Login: admin / <secret>"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eda-provision
  namespace: eda
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provision
        image: curlimages/curl:latest
        command: ["/bin/sh", "/scripts/provision.sh"]
        volumeMounts:
        - name: script
          mountPath: /scripts
        - name: eda-secret
          mountPath: /secrets
      volumes:
      - name: script
        configMap:
          name: eda-provision-script
          defaultMode: 0755
      - name: eda-secret
        secret:
          secretName: eda-admin-password
