---
# EDA Resources ConfigMap
# Contains all EDA resources to be created via API
apiVersion: v1
kind: ConfigMap
metadata:
  name: eda-resources
  namespace: eda
data:
  # Decision Environment
  decision-environment.json: |
    {
      "name": "Demo Decision Environment",
      "description": "Default decision environment for running rulebooks",
      "image_url": "quay.io/ansible/ansible-rulebook:v1.1.1",
      "organization_id": 1,
      "pull_policy": "always"
    }

  # Project
  project.json: |
    {
      "name": "Demo EDA Project",
      "description": "Demo project with sample rulebooks",
      "url": "https://github.com/ansible/event-driven-ansible",
      "organization_id": 1
    }

  # Basic Event Stream Credential
  credential-event-stream.json: |
    {
      "name": "github-webhook-cred",
      "credential_type_id": 7,
      "organization_id": 1,
      "inputs": {
        "username": "github",
        "password": "webhook123",
        "auth_type": "basic",
        "http_header_key": "Authorization"
      }
    }

  # Container Registry Credential
  credential-registry.json: |
    {
      "name": "Container Registry Cred",
      "credential_type_id": 2,
      "organization_id": 1,
      "inputs": {
        "host": "quay.io",
        "username": "myuser",
        "password": "mypassword"
      }
    }

  # Event Stream
  event-stream.json: |
    {
      "name": "github-events",
      "organization_id": 1,
      "eda_credential_id": 1
    }

  # Rulebook Activation (disabled by default)
  activation.json: |
    {
      "name": "Demo Webhook Activation",
      "description": "Listens for webhook events and triggers AWX jobs",
      "rulebook_id": 10,
      "decision_environment_id": 1,
      "organization_id": 1,
      "is_enabled": false
    }
