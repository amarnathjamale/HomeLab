---
# =============================================================================
# Example 1: Monitor Zendesk Tickets with API Token Authentication
# =============================================================================
# This is the RECOMMENDED authentication method for production use
#
- name: Monitor Zendesk Tickets (API Token)
  hosts: localhost
  
  sources:
    - name: zendesk_tickets_token
      custom.zendesk_eda.zendesk_api_pull:
        zendesk_email: "{{ zendesk_email }}"
        zendesk_api_token: "{{ zendesk_api_token }}"
        zendesk_host: "company.zendesk.com"
        endpoint: "/api/v2/tickets.json"
        query_params:
          per_page: 100
        delay: 60

  rules:
    - name: Print Zendesk tickets
      condition: event.zendesk is defined and event.zendesk.error is not defined
      action:
        debug:
          msg: "Received {{ event.zendesk.items.count }} tickets from Zendesk"


