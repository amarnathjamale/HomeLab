# =============================================================================
# Example 10: Sunbird DCIM Hardware ID Replacement
# =============================================================================
- name: Sunbird DCIM Hardware ID Swap
  hosts: all

  vars:
    hardware_old_field_id: 111111111
    hardware_new_field_id: 222222222

  sources:
    - name: zendesk_dcim_swap
      custom.zendesk_eda.zendesk_api_pull:
        zendesk_host: "company.zendesk.com"
        zendesk_encrypted_token_header: "{{ zendesk_auth_header }}"
        endpoint: "/api/v2/search.json"
        query_params:
          query: "type:ticket status:open tags:dcim_swap"
        delay: 90

  rules:
    - name: DCIM hardware ID replacement requested
      condition: >
        event.zendesk.error is not defined and
        event.zendesk.data.results is defined and
        (
          event.zendesk.data.results
          | json_query('[?custom_fields[?id==`' ~ hardware_old_field_id ~ '` && value!=null] && custom_fields[?id==`' ~ hardware_new_field_id ~ '` && value!=null]].id')
          | length > 0
        )
      action:
        run_playbook:
          name: sunbird_replace_hardware_id.yml
          extra_vars:
            tickets: "{{ event.zendesk.data.results | json_query('[?custom_fields[?id==`' ~ hardware_old_field_id ~ '` && value!=null] && custom_fields[?id==`' ~ hardware_new_field_id ~ '` && value!=null]]') }}"
            hardware_old_field_id: "{{ hardware_old_field_id }}"
            hardware_new_field_id: "{{ hardware_new_field_id }}"


---
# =============================================================================
# TIPS FOR AUTHENTICATION
# =============================================================================
#
# If you're getting 401 errors:
#
# 1. Use Pre-encoded Header (Example 3):
#    - Generate: ./generate_auth_header.sh email@company.io TOKEN token
#    - Test with curl: curl -H 'Authorization: Basic BASE64' https://...
#    - If curl works → use that exact BASE64 in the rulebook
#
# 2. Common Issues:
#    - Base64 on multiple lines (use: | base64 | tr -d '\n')
#    - Wrong credentials format (token needs email/token:TOKEN)
#    - Expired/invalid API token (create new token in Zendesk)
#    - Wrong Zendesk host (should be subdomain.zendesk.com)
#
# 3. Debugging:
#    - Check AAP logs for the actual Authorization header sent
#    - Compare with what curl sends (curl -v shows headers)
#    - Verify credentials work in Zendesk admin panel
