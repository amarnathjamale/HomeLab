---
# EDA Instance Configuration
# Deploy after operator is ready
apiVersion: eda.ansible.com/v1alpha1
kind: EDA
metadata:
  name: eda
  namespace: eda
spec:
  # AWX Controller connection
  automation_server_url: http://awx-service.awx.svc.cluster.local:80

  # Admin user configuration
  admin_user: admin
  admin_password_secret: eda-admin-password

  # Service configuration
  service_type: NodePort
  nodeport_port: 30081

  # Image configuration - hardcoded working versions
  # Server: sha-55b0619 (Nov 20 2025 - has organizations, pre-dispatcherd migration)
  image: quay.io/ansible/eda-server
  image_version: sha-55b0619

  # UI: latest stable (Jan 2026)
  image_web: quay.io/ansible/eda-ui
  image_web_version: latest
