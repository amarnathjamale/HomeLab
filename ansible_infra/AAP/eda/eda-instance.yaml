---
# EDA Instance Configuration
# Deploy after operator is ready
apiVersion: eda.ansible.com/v1alpha1
kind: EDA
metadata:
  name: eda
  namespace: eda
spec:
  # AWX Controller connection
  automation_server_url: http://awx-demo-service.awx.svc.cluster.local:80

  # Service configuration
  service_type: NodePort
  nodeport_port: 30081

  # Image configuration (using main branch for latest fixes)
  image: quay.io/ansible/eda-server
  image_version: main
  image_web: quay.io/ansible/eda-ui
  image_web_version: main

  # PostgreSQL configuration
  postgres_storage_class: standard
  postgres_storage_requirements:
    requests:
      storage: 8Gi
