apiVersion: v1
kind: ConfigMap
metadata:
  name: eda-ui-nginx-conf
  namespace: eda
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        map $http_x_forwarded_proto $remote_scheme {
            default $http_x_forwarded_proto;
            ''      $scheme;
        }

        include mime.types;
        types {
            application/manifest+json webmanifest;
        }
        server {
            listen 8080;
            listen [::]:8080;

            server_name _;
            server_tokens off;

            access_log off;

            autoindex off;

            include mime.types;
            types {
                application/manifest+json webmanifest;
            }

            sendfile on;

            root /opt/app-root/ui/eda;

            location ~ ^/api/eda/v[0-9]+/ {
                proxy_pass http://eda-api:8000;
                proxy_set_header Origin http://eda-api:8000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Proto $remote_scheme;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /api/eda/ws/ {
                proxy_pass http://eda-daphne:8001;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Proto $remote_scheme;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location ~* \.(json|woff|woff2|jpe?g|png|gif|ico|svg|css|js)$ {
                add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
                try_files $uri =404;
                gzip_static on;
            }

            location / {
                autoindex off;
                expires off;
                add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
                try_files $uri $uri/ /index.html =404;
            }
        }
    }
